name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SecurityAuditPlatform.sln
      - name: Build
        run: dotnet build SecurityAuditPlatform.sln --configuration Release --no-restore -bl:build.binlog
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: build.binlog
          if-no-files-found: ignore
      - name: Test
        run: dotnet test SecurityAuditPlatform.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
