schema_version: 1
id: official.identity.netexec
name: NetExec
version: 0.1.0
category: Identity
runtime: wsl
entrypoint: nxc
capabilities:
  - identity
privileges:
  - network
requires:
  tools:
    - nxc
  hardware: []
  runtimes:
    - wsl
network:
  behavior: active
execution:
  executable: nxc
  arguments:
    - "smb"
    - "{target}"
  timeout_seconds: 3600
license:
  spdx: UNKNOWN
source:
  type: upstream
  repository: https://github.com/Pennyw0rth/NetExec
  ref: main
evidence:
  - stdout
  - stderr
