schema_version: 1
id: official.active-directory.responder
name: Responder
version: 0.1.0
category: ActiveDirectory
runtime: wsl
entrypoint: responder
capabilities:
  - active-directory
privileges:
  - network
requires:
  tools:
    - responder
  hardware: []
  runtimes:
    - wsl
network:
  behavior: active
execution:
  executable: responder
  arguments:
    - "-I"
    - "{target}"
  timeout_seconds: 3600
license:
  spdx: UNKNOWN
source:
  type: upstream
  repository: https://github.com/lgandx/Responder
  ref: main
evidence:
  - stdout
  - stderr
