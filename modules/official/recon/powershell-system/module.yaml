schema_version: 1
id: official.recon.powershell-system
name: Windows PowerShell System Recon
version: 0.1.0
category: recon
runtime: windows
entrypoint: powershell.exe
capabilities:
  - local-system-enumeration
  - process-enumeration
  - network-configuration
privileges:
  - user
requires:
  tools:
    - powershell
  hardware: []
  runtimes:
    - windows
network:
  behavior: passive
execution:
  executable: powershell.exe
  arguments:
    - "-NoProfile"
    - "-NonInteractive"
    - "-Command"
    - "$PSVersionTable; Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber; Get-NetIPConfiguration | Format-List"
  timeout_seconds: 300
license:
  spdx: MIT
source:
  type: builtin
evidence:
  - stdout
  - stderr
