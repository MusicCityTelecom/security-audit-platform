schema_version: 1
id: official.recon.amass
name: Amass
version: 0.1.0
category: Recon
runtime: wsl
entrypoint: amass
capabilities:
  - recon
privileges:
  - network
requires:
  tools:
    - amass
  hardware: []
  runtimes:
    - wsl
network:
  behavior: active
